name: Run Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8.5

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
    
    - name: Setup Rocky 8 environment
      run: |
        dnf -y update
        dnf -y install 'dnf-command(config-manager)' || dnf -y install dnf-plugins-core || true
        dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb || true
        dnf -y install git gcc gcc-c++ make openblas openblas-devel
        dnf -y groupinstall "Development Tools"
        dnf -y install gcc-toolset-14
        dnf -y install python3.12 python3.12-pip

    - name: Install uv
      run: python3.12 -m pip install uv

    - name: Install and run tests in venv
      run: |
        scl enable gcc-toolset-14 bash
        gcc --version
        cd tests/rtgsfit_verify_analytic
        pwd
        uv venv --python 3.13
        source .venv/bin/activate
        uv pip install -e "."
        pytest

    - name: Build and run null points test
      working-directory: src
      run: |
        make clean
        cp ../test_data/constants.c .
        make SHOT=0 RUN_NAME=no_mds DEBUG=1 test_find_plasma
        ./test_find_plasma

    - name: Build and run Poisson solver tests
      working-directory: src
      run: |
        make SHOT=0 RUN_NAME=no_mds DEBUG=1 test_poisson_fast test_poisson_invalid
        OPENBLAS_NUM_THREADS=1 ./test_poisson_fast
        OPENBLAS_NUM_THREADS=1 ./test_poisson_invalid

    - name: Build the timing benchmark driver
      working-directory: tests
      run: |
        make -f makefile_bench TIMING=1
    - name: ASan/UBSan (scratch, not for merge)
      working-directory: src
      run: |
        source /opt/rh/gcc-toolset-14/enable
        export OPENBLAS_NUM_THREADS=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ASAN_OPTIONS=detect_leaks=1
        SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu11 -I. -I/usr/include/openblas"
        gcc $SAN -o /tmp/san_test ../tests/test_poisson_fast.c poisson_fast.c poisson_solver.c gradient.c ../test_data/constants.c -lm -lopenblas
        /tmp/san_test
        gcc $SAN -DEXPECT_INVALID -o /tmp/san_invalid ../tests/test_poisson_fast.c poisson_fast.c poisson_solver.c gradient.c ../test_data/constants_poisson_invalid.c -lm -lopenblas
        /tmp/san_invalid
        cd ../tests/rtgsfit_verify_analytic && source .venv/bin/activate && python -m rtgsfit_verify_analytic.export_bench_inputs && cd ../../src
        gcc $SAN -o /tmp/san_bench ../tests/rtgsfit_bench.c rtgsfit.c poisson_fast.c poisson_solver.c gradient.c find_x_point.c find_plasma.c ../tests/rtgsfit_verify_analytic/data/constants.c -lm -lopenblas
        mkdir -p /tmp/san_out
        /tmp/san_bench ../tests/rtgsfit_verify_analytic/data/bench 10 20 /tmp/san_out
        /tmp/san_bench ../tests/rtgsfit_verify_analytic/data/bench_zero 10 5 /tmp/san_out
